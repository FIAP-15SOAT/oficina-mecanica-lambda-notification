name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_base_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_k8s_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_messaging_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  # Direct upload limit for the zipped package, in bytes (50 MiB).
  PACKAGE_SIZE_LIMIT_BYTES: "52428800"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      - name: Lint
        working-directory: app
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      # esbuild strips type annotations without checking them, so without this job a type error ships
      - name: Type check
        working-directory: app
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      # The 100% threshold on all four metrics lives in jest.config.ts: coverage below it fails here
      - name: Unit tests with coverage
        working-directory: app
        run: npm run test:cov

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
      - name: E2E tests against LocalStack and MailHog
        working-directory: app
        run: npm run test:e2e

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci

      - name: Build
        working-directory: app
        run: npm run build

      # Loaded outside the repository tree: module resolution walks up the ancestor directories
      # and would find the installed dependencies, turning the assertion into theater
      - name: Load the entry point with no dependencies installed
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "${GITHUB_WORKSPACE}/app/dist/handler.js" "${staging}/handler.js"
          cd "${staging}"
          node -e "
            const loaded = require('./handler.js');
            if (typeof loaded.handler !== 'function') {
              throw new Error('O ponto de entrada não expõe a função de tratamento.');
            }
            console.log('O ponto de entrada carrega sem dependências e expõe a função de tratamento.');
          "

      - name: Check the package against the direct upload limit
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          (cd "${GITHUB_WORKSPACE}/app/dist" && zip -q -r -X "${staging}/handler.zip" .)
          size="$(stat -c %s "${staging}/handler.zip")"
          echo "Pacote compactado: ${size} bytes (limite ${PACKAGE_SIZE_LIMIT_BYTES})."
          if [ "${size}" -gt "${PACKAGE_SIZE_LIMIT_BYTES}" ]; then
            echo "::error::O pacote excede o limite de envio direto da plataforma."
            exit 1
          fi

  tf-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform Init Lambda Notification
        run: terraform init -backend=false -no-color
        working-directory: infra

      - name: Terraform Validate Lambda Notification
        run: terraform validate -no-color
        working-directory: infra

      - uses: ./.github/actions/setup-ci

      - name: Build the package for the plan
        working-directory: app
        run: npm run build

      - name: Configure AWS Credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Plan Lambda Notification
        if: steps.aws_creds.outcome == 'success'
        working-directory: infra
        run: |
          terraform init -reconfigure -no-color -backend-config="bucket=$TF_STATE_BUCKET"
          terraform plan -no-color

      - name: Note skipped plan in job summary
        if: steps.aws_creds.outcome == 'failure'
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          {
            echo '### Plano do Terraform — pulado ⏭️'
            echo ''
            echo 'O ambiente de destino parece indisponível, então o `terraform plan` foi pulado. **Isso não bloqueia o CI**: `fmt` e `validate` passaram. Rode o job de novo com o ambiente no ar para ver o plano.'
          } >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - unit-tests
      - e2e-tests
      - package
      - tf-validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Open a PR to main if none exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base main --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "Já existe um PR aberto de ${HEAD_BRANCH} para main; nada a fazer."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "PR aberto automaticamente pelo CI em nome de @${ACTOR}, depois que todas as verificações passaram em \`${HEAD_BRANCH}\`."
